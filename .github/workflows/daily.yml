name: daily-news

on:
  schedule:
    # 21:43 UTC = 06:43 JST
    # schedule はベストエフォートで高負荷時に遅延するため、cron が集中する
    # 毎時 00/15/30/45 分を避けて半端な分に置いている。
    - cron: "43 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

# cron と workflow_dispatch の同時実行で push が競合しないよう直列化する
concurrency:
  group: daily-news-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # push 前の rebase で共通祖先を確実に持つため全履歴を取る
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前回実行のフィードキャッシュ (ETag/Last-Modified + last-good items) を復元する。
      # 304 Not Modified を引けるとフィード取得が大幅に短縮される。
      - name: Restore feed cache
        uses: actions/cache@v6
        with:
          path: data/.cache
          key: feed-cache-${{ github.run_id }}
          restore-keys: |
            feed-cache-

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --filter @daily-news/pipeline start

      - name: Commit data
        run: |
          # git diff は untracked の新規 data/YYYY-MM-DD.json を検知しないので status で見る
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: $(date -u +%Y-%m-%d) collection"

          # checkout 後にリモートが進んでいると push が rejected されるため、
          # rebase で自分のコミットを積み直してから push する (数回リトライ)
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "::error::rebase failed (conflict?); aborting"
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "push rejected; retry $attempt"
          done
          echo "::error::push failed after 3 attempts"
          exit 1
